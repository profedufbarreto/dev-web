<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>
    
</head>
<body>

<form action="#" method="post">

    <label for="nome">Nome:</label>
    <br><br>
    <input type="text" id="nome" placeholder="Seu nome.." required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="seuemail@email.com">
    <br><br>
    <label for="senha">Senha:</label>
    <input type="password" id="senha" required>
    <br><br>
    <label for="mensagem">Mensagem:</label>
    <br><br>
    <textarea name="mensagem" id="mensagem" rows="4" 
    cols="50" placeholder="Escreva aqui.."></textarea>
    <br><br>
    <label for="cidade">Cidade:</label>
    <select name="cidade" id="cidade">
        <option value="">Selecione..</option>
        <option value="nh">Novo Hamburgo</option>
        <option value="sl">São Leopoldo</option>
        <option value="cb">Campo Bom</option>
        <option value="mgo">Montenegro</option>
    </select>

    

</form>

</body>
</html>
