<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Store</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header class="topo">
        <h1>🎮Game Store</h1>
        <nav>
            <a href="#">Início</a>
            <a href="#">Jogos</a>
            <a href="#">Promoção</a>
            <a href="#">Contato</a>
        </nav>
    </header>
    <section class="destaque">
        <h2>Encontre seu próximo jogo!</h2>
        <p>Os melhores jogos estão aqui.</p>
    </section>
    <main class="container">
        <div class="card">
            <div class="imagem imagem1">🏎️</div>
            <h3>Speed Racing</h3>
            <p>Prepare-se para corridas incríveis!</p>
            <span>R$ 89,90</span>
            <button>Comprar</button>
        </div>
        <div class="card">
            <div class="imagem imagem2">⚔️</div>
            <h3>Warrior Legend</h3>
            <p>Uma aventura cheia de desafios.</p>
            <span>R$ 119,90</span>
            <button>Comprar</button>
        </div>
    </main>

</body>
</html>
