<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botão com JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
    <h1>Personalizador de texto</h1>

    <form id="formEstilo">
        <label for="campoCor">Cor (nome ou hex):</label>
        <input type="text" id="campoCor" placeholder="ex: red ou #ff0000">

        <label for="campoPadding">Padding (px):</label>
        <input type="number" id="campoPadding" placeholder="ex: 10">

        <label for="campoTamanho">Tamanho da letra (px):</label>
        <input type="number" id="campoTamanho" placeholder="ex: 20">

        <button type="submit">Aplicar</button>
    </form>

    <p id="retorno">Esta é a sua mensagem.</p>
</main>

    <script src="/js/script.js"></script>
</body>
</html>
